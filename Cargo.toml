[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mbround18/k8s-reaper"
publish = false

[workspace.dependencies]
reaper-core = { path = "crates/reaper-core" }
reaper-kube = { path = "crates/reaper-kube" }
reaper-flux = { path = "crates/reaper-flux" }
reaper-observability = { path = "crates/reaper-observability" }
reaper-notify = { path = "crates/reaper-notify" }

anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
globset = { version = "0.4.20", default-features = false }
http = "1.5.0"
http-body-util = "0.1.5"
insta = { version = "1.49.0", features = ["json"] }
k8s-openapi = { version = "0.28.0", features = ["v1_36", "schemars"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "ring", "runtime", "derive"] }
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["metrics", "trace"] }
percent-encoding = "2.3.2"
prometheus-client = "0.25.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-test = "0.4.0"
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
url = "2.5.8"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
