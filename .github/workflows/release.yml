name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docker-release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mbround18/paws/actions/paws-up@f84ca66721b657788672c06b41661a79afe07dd7 # main
        with:
          version: v0.0.1-prerelease.53
      # v0.1.1 publishes mbround18/k8s-reaper:0.1.1 and :latest on Docker Hub,
      # mirrored to ghcr.io.
      - run: >
          paws docker
          --image mbround18/k8s-reaper
          --version "$GITHUB_REF_NAME"
          --no-prefix
          --with-latest
          --registries ghcr.io
          --dockerfile Dockerfile
          --context .
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          --label org.opencontainers.image.version=${{ github.ref_name }}
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
