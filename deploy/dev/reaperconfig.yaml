# Dev ReaperConfig: short thresholds so fixtures become candidates within
# minutes. Ranges are enforced by Config::from_raw (crates/reaper-core).
apiVersion: reaper.boop.ninja/v1alpha1
kind: ReaperConfig
metadata:
  name: default
spec:
  mode: report
  cycleInterval: 15s # 10s–10m
  detection:
    crashLoopDuration: 5m # 5m–7d (minimum)
    minRestarts: 3 # 1–10000
    recoveryWindow: 1m # 1m–1d (minimum)
  scope:
    excludeNamespaces: [kube-system, kube-public, kube-node-lease, flux-system]
    includeNamespaces: []
  limits:
    maxReapsPerCycle: 1 # quickstart §3 relies on one reap per cycle
    maxReaped: 5
  flux:
    kustomize: true
    helmRelease: true
  cronJobs:
    enabled: true
    failingDuration: 10m # 10m–7d (minimum)
    minFailedRuns: 3 # 1–1000
