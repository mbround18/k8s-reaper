# One key per channel (contracts/notifications.md). The reaper's Deployment
# mounts this at /etc/k8s-reaper/notifications with optional: true.
apiVersion: v1
kind: Secret
metadata:
  name: k8s-reaper-notifications
  namespace: k8s-reaper
stringData:
  dev-echo: http://echo.notify-dev.svc.cluster.local:8080/hooks/reaper?insecure=true
  dev-mail: smtp://mailpit.notify-dev.svc.cluster.local:1025?insecure=true&from=reaper@example.test&to=oncall@example.test,sre@example.test
