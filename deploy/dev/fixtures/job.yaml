# job/fail: a Job whose pods fail. Expect: ignored (Jobs are never workloads).
apiVersion: batch/v1
kind: Job
metadata:
  name: fail
  namespace: job
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: busybox:1.36.1
          command: ["false"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 16Mi }
