# plain/crashloop: crash-looping Deployment, no Flux labels.
# Expect: candidate, then reaped in full mode.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop
  namespace: plain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crashloop
  template:
    metadata:
      labels:
        app: crashloop
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: busybox:1.36.1
          command: ["false"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 16Mi }
