# kustomize/crashloop payload. Pushed as an OCI artifact and applied by the
# Flux Kustomization flux-system/dev-kustomize (targetNamespace: kustomize),
# which adds the kustomize.toolkit.fluxcd.io/{name,namespace} labels.
# Expect: candidate, then reaped in full mode with reconcile disabled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crashloop
  template:
    metadata:
      labels:
        app: crashloop
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: busybox:1.36.1
          command: ["false"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 16Mi }
